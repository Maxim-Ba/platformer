# MinIO console :9001 MUST NOT be a public Ingress route.
# Admin access (not via Ingress):
#   kubectl -n platformer port-forward svc/platformer-minio 9001:9001
apiVersion: v1
kind: Service
metadata:
  name: platformer-minio
  namespace: platformer
spec:
  type: ClusterIP
  selector:
    app: platformer-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
