# Traefik rewrite for same-origin media (task 2.2).
# Expected mapping: /media/assets/... → path-style S3 /platformer-assets/assets/...
# Wire the chain Middleware to the /media Ingress path only (must not apply to `/`).
#
# Traefik allows one middleware type per Middleware object. Putting stripPrefix and
# addPrefix in the same spec leaves the /media router unusable, so Prefix `/` serves
# the SPA index.html for map JSON (HTTP 200, Content-Type text/html) and Phaser
# starts GameScene on a blank screen.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platformer-minio-media-strip
  namespace: platformer
spec:
  stripPrefix:
    prefixes:
      - /media
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platformer-minio-media-add
  namespace: platformer
spec:
  addPrefix:
    prefix: /platformer-assets
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: platformer-minio-media
  namespace: platformer
spec:
  chain:
    middlewares:
      - name: platformer-minio-media-strip
      - name: platformer-minio-media-add
