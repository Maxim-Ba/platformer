server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;


  # Hashed Vite JS/CSS (e.g. /assets/index-*.js) — long cache from this image.
  # Game maps/sprites are not required here; canonical origin is /media/assets/... (MinIO).
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Hashed Vite bundles under /assets/ (index-*.js). Maps may 404 from this image.
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Canonical maps/sprites are MinIO via Traefik `/media`. If that router is down,
  # Prefix `/` would land here — never SPA-fallback JSON as index.html (Phaser
  # treats HTTP 200 HTML as a loaded tilemap and GameScene stays blank).
  location ^~ /media/ {
    return 404;
  }

  # SPA fallback: `/` serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
